[build]
  command = "vite build && node scripts/generate-html.mjs"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions-clean"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

# Campaigns and Glo call these public paths. Rewrite to functions
# before the SPA fallback. force=true so HTML does not win.
[[redirects]]
  from = "/api/agents/copywriter"
  to = "/.netlify/functions/copywriter"
  status = 200
  force = true

[[redirects]]
  from = "/api/agents/company-prospect"
